# Scaled stack: nginx in front of several copies of the Spring Boot app.
# The Java source is unchanged. Run this file on its own — stop the normal
# stack first, because both publish ports 9090 and 3307.
#
#   docker compose -f docker-compose-scale.yml up -d --build --scale app=3
#
# Guide: DOCKER-SCALE.md

# application name+app+number --container name 

name: devops-java-demo

services:
  mysqldb:
    image: mysql:8.4
    container_name: mysql_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE: $MYSQL_DATABASE
      MYSQL_USER: $MYSQL_USER
      MYSQL_PASSWORD: $MYSQL_PASSWORD
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - devops-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $MYSQL_ROOT_PASSWORD -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    # DOCKERHUB_USER and IMAGE_TAG come from .env. deploy.ps1 sets a new IMAGE_TAG, then builds and pushes.
    build: .
    image: ${DOCKERHUB_USER}/devops-java-demo:${IMAGE_TAG}
    pull_policy: always
    # No container_name: a fixed name can exist only once, so scaling would fail.
    # No ports: only one container can bind host port 9090. nginx publishes it.
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/$MYSQL_DATABASE?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: $MYSQL_USER
      SPRING_DATASOURCE_PASSWORD: $MYSQL_PASSWORD
    expose:
      - "9090"
    depends_on:
      mysqldb:
        condition: service_healthy
    # /name returns 200 only after Spring is listening. Compose waits for every
    # replica to pass this before it starts nginx.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/name"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      replicas: 3 //hpa (horizontal container scaling) // Vertical Container/pod scaling  
    networks:
      - devops-net

  proxy:
    image: nginx:alpine
    container_name: devops-java-nginx
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - devops-net

volumes:
  mysql_data:

networks:
  devops-net:
    driver: bridge

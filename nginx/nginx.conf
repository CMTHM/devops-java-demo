log_format upstreamlog '$remote_addr "$request" $status upstream=$upstream_addr';

server {
    listen 80;

    # Docker DNS. proxy_pass http://app:9090 alone is resolved only once, at startup.
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log /dev/stdout upstreamlog;

    location / {
        set $app_name app;
        proxy_pass http://$app_name:9090; # http://app:9090
        # $host drops the port. Swagger then calls http://localhost (port 80)
        # while the page is http://localhost:9090, and the browser reports CORS.
        # $http_host keeps localhost:9090.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_pass_request_headers on;
    }
}

spring.application.name=devops-java-demo
server.port=9090

# MySQL database
# These values are used when the app runs on your computer (mvn spring-boot:run) against the
# MySQL container started with: docker compose up -d mysql (published on host port 3307)
# Inside Docker Compose the app container overrides them with the environment variables
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD (see compose.yaml)
spring.datasource.url=jdbc:mysql://localhost:3307/trishadb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=trisha
spring.datasource.password=trisha@123

# JPA - creates/updates the students table and keeps existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
